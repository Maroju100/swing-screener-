name: GPT audit validation
on:
  push:
    branches: [gpt-research-audit]
    paths:
      - '.github/workflows/gpt-audit-validation.yml'
      - 'scripts/gpt_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure production ref exists
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile GPT audit scripts
        run: python -m py_compile scripts/gpt_capital_sensitivity.py scripts/gpt_symbol_attribution.py scripts/gpt_live_reconciliation.py scripts/gpt_transcript_proxy_backtests.py scripts/gpt_youtube_strategy_backtest.py scripts/gpt_transcript_setups_backtest.py scripts/gpt_transcript_setup_backtest.py
      - name: Run capital sensitivity
        run: python scripts/gpt_capital_sensitivity.py --capitals 5000 10000 15000 17494.91 17500 17696.92 20000 40000 80000 --cost-bps 0 --output data/research/gpt_capital_sensitivity_0bps.json
      - name: Run capital sensitivity at 5 bps
        run: python scripts/gpt_capital_sensitivity.py --capitals 5000 10000 15000 17494.91 17500 17696.92 20000 40000 80000 --cost-bps 5 --output data/research/gpt_capital_sensitivity_5bps.json
      - name: Run symbol attribution
        run: python scripts/gpt_symbol_attribution.py --cost-bps 0 --output data/research/gpt_symbol_attribution_0bps.json
      - name: Run live-scale reconciliation
        run: python scripts/gpt_live_reconciliation.py
      - name: Run transcript setup proxy backtests
        run: python scripts/gpt_transcript_setups_backtest.py
      - name: Run YouTube transcript strategy batch 1
        run: python scripts/gpt_youtube_strategy_backtest.py
      - name: Run normalized transcript setup comparison
        run: python scripts/gpt_transcript_setup_backtest.py
      - name: Run transcript proxy backtests
        run: python scripts/gpt_transcript_proxy_backtests.py
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-audit-results
          path: |
            data/research/gpt_capital_sensitivity_0bps.json
            data/research/gpt_capital_sensitivity_5bps.json
            data/research/gpt_symbol_attribution_0bps.json
            data/research/gpt_live_reconciliation_17_5k.json
            data/research/gpt_transcript_proxy_backtests.json
            data/research/youtube_strategy_batch1_results.json
            data/research/gpt_transcript_setup_backtests.json
            data/research/transcript_setup_backtest.json
          if-no-files-found: warn
